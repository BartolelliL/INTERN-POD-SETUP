; PATH = /etc/usb-backup.conf

# USB label required to allow execution (safety filter).
EXPECTED_LABEL="4GB-PEN"

# Main script to run once the USB is accepted.
ACTION_SCRIPT="/usr/local/bin/usb_backup_reset.sh"

# Temporary mount base directory used by wrapper script.
MOUNT_ROOT="/run/usb-backup"

# Set to "yes" only if you intentionally want to keep the USB mounted.
LEAVE_MOUNTED="no"
